<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F2335">
<meta name="description" content="달의정원 손뜨개 대바늘 도안 설계. 치수, 여유분, 게이지로 차트 도안과 서술형 도안을 만듭니다">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="코와단">
<link rel="icon" id="favicon" href="data:,">
<title>코와단, 달의정원 손뜨개 도안 설계</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nanum-pen-script@5.3.0/index.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  /* 달의정원: 밤하늘 남색, 달빛 크림, 금색 실, 손글씨 세 색 */
  --night:#1F2335; --night2:#2D3352; --moon:#F7F2E6; --gold:#B8862F;
  --bg:#F7F2E6; --card:#FFFDF8; --surface-sub:#F1EADB;
  --ink:#1F1D1A; --ink2:#5C5346; --line:#E9E0CE; --line2:#D9CDB5;
  --rose:#8A6320; --rose2:#F5EAD2; --accent:#5E57A6; --accent2:#ECEAF7;
  --warn:#FBF1E2; --warnb:#E0B877;
  --shadow:0 2px 10px rgba(31,35,53,0.05);
  --hdr-h:60px; --tabs-h:50px;
  --sans:'Pretendard Variable','Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --hand:'Nanum Pen Script',var(--sans);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;letter-spacing:-0.005em;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
input[type=number],.mtable,.tbl,.kv,.prog,.rjump,.aformula,svg text{font-variant-numeric:tabular-nums}

/* 헤더 */
.top{position:sticky;top:0;z-index:30;height:var(--hdr-h);background:var(--night);color:var(--moon);padding:0 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.bmark{flex:0 0 auto;display:flex;width:40px;height:40px}
.bmark svg{width:40px;height:40px;display:block}
.bname{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.logo{font-weight:800;font-size:20px;letter-spacing:-0.03em;color:var(--moon)}
.sub{font-family:var(--hand);font-size:19px;letter-spacing:0;white-space:nowrap}
.sub .h1{color:#B9B1F5}.sub .h2{color:#EDBB55}.sub .h3{color:#62CDB6}
.top .btn.pri{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:700}
.top .btn.pri.dirty{box-shadow:0 0 0 3px rgba(237,187,85,.45)}
.hdr{display:flex;gap:8px;align-items:center}
.pname,.hdr select{background:var(--card);border:1px solid transparent;border-radius:10px;padding:7px 11px;color:var(--ink)}
.pname{width:220px;min-width:0}
.pname:focus,.hdr select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,134,47,.45)}

/* 탭 */
.tabs{position:sticky;top:var(--hdr-h);z-index:29;display:flex;align-items:center;gap:2px;overflow-x:auto;background:rgba(247,242,230,0.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 14px;height:var(--tabs-h);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tgl{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.04em;padding:0 6px 0 4px}
.tdiv{flex:0 0 auto;width:1px;height:22px;background:var(--line2);margin:0 10px}
.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;background:none;padding:7px 11px;font-weight:500;color:var(--ink2);border-radius:9px;cursor:pointer;position:relative}
.tabs button:hover{background:var(--surface-sub);color:var(--ink)}
.tabs button.on{color:var(--night);font-weight:700;background:var(--rose2);box-shadow:inset 0 -2px 0 var(--gold)}
.ic{flex:0 0 auto}

main{max-width:1240px;margin:0 auto;padding:18px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 8px;font-weight:700;letter-spacing:-0.02em}
.card h3,.icard h3,.alloc h3{font-size:14px;margin:14px 0 8px;font-weight:700;letter-spacing:-0.01em}
.desc{margin:4px 0 12px;color:var(--ink2);font-size:14px}
.desc.small{font-size:13px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row.wrap{flex-wrap:wrap}
.row.end{justify-content:flex-end}
.btn{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--rose)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.pri{background:var(--night);border-color:var(--night);color:var(--moon)}
.btn.pri:hover{background:var(--night2);border-color:var(--gold)}
.btn.pri:hover{background:#7A3229}
.btn.pri.dirty{box-shadow:0 0 0 3px rgba(184,134,47,.4)}
.btn.ghost{background:none}
.btn.big{padding:11px 22px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.inp{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;min-width:0;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:20px;padding:5px 13px;cursor:pointer;background:#fff;font-weight:500;user-select:none;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--rose)}
.chip.on{background:var(--night);border-color:var(--night);color:var(--moon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.fld.wide{grid-column:1/-1}
.lb{font-size:13px;font-weight:700;color:var(--ink)}
.hp{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--ink2);line-height:1.4}
.iw{display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;background:#fff;overflow:hidden}
.iw:focus-within{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose2)}
.iw input,.iw select{border:0;outline:0;padding:9px 10px;width:100%;background:transparent;min-width:0}
.iw em{font-style:normal;padding:0 10px;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg{align-self:flex-start;display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--surface-sub);border-radius:11px;padding:3px;max-width:100%}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;font-weight:500;border-radius:8px;color:var(--ink2)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--rose);font-weight:700;box-shadow:0 1px 3px rgba(28,25,23,.1)}
.seg small{font-weight:500;color:inherit;opacity:.8;font-size:12px}
.chk{display:inline-flex;align-items:flex-start;gap:6px;cursor:pointer;margin-right:10px;font-size:14px}
.chk input{width:18px;height:18px;margin-top:3px;flex:0 0 auto;accent-color:var(--rose)}

/* 치수 */
.pgroups{display:flex;flex-direction:column;gap:6px;margin:4px 0 6px}
.pg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pgl{font-size:12px;font-weight:700;color:var(--ink2);min-width:34px}
.fitbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.mtable{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mh,.mr{display:grid;grid-template-columns:1.6fr 1fr 1fr .8fr;gap:8px;align-items:center;padding:8px 12px}
.mh{background:var(--surface-sub);font-weight:700;font-size:13px}
.mr{border-top:1px solid var(--line)}
.mr input{width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px;background:#fff;text-align:right}
.mr input:focus{outline:0;border-color:var(--rose);box-shadow:0 0 0 3px var(--rose2)}
.mn{font-weight:700;font-size:14px}
.mn i{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--ink2);line-height:1.35}
.mt{font-weight:700;font-size:16px;text-align:right;color:var(--rose)}

/* 스플릿 + 인스펙터 */
.split{display:block}
.insp .icard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.insp .icard h3{margin:0 0 8px}
.mini svg{max-width:100%;height:auto;display:block;margin:0 auto}
.kv{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.kv th,.kv td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.kv td{text-align:right;font-weight:600}
.kv thead th{font-size:12px;color:var(--ink2);font-weight:700}
.kv.pcs td{font-weight:500}
@media (min-width:1024px){
  .split{display:grid;grid-template-columns:62fr 38fr;gap:18px;align-items:start}
  .insp{position:sticky;top:116px;max-height:calc(100vh - 130px);overflow:auto;padding-bottom:6px}
  .mwarn{display:none}
}

/* 코 배열 바 */
.alloc{margin-top:14px;border-top:1px dashed var(--line2);padding-top:6px}
.abar{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line2)}
.abar span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink);min-width:2px;border-right:1px solid rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.abar span:last-child{border-right:0}
.alegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin:8px 0;color:var(--ink2)}
.alegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line2)}
.aformula{font-size:13px;line-height:1.7;margin:4px 0 8px;word-break:keep-all}

.alert{background:var(--warn);border:1px solid var(--warnb);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.alert ul{margin:4px 0 0;padding-left:18px}
.ok{background:var(--accent2);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0;font-weight:600}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pitem.cur{border-color:var(--rose);background:var(--rose2)}
.pinfo{display:flex;flex-direction:column;font-size:13px}
.pinfo b{font-size:15px}
.pact{display:flex;gap:6px}
.memo{width:100%;min-height:110px;border:1px solid var(--line2);border-radius:12px;padding:10px}

/* 무늬 */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mcard{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.mhead{display:flex;flex-direction:column}
.mhead span{font-size:12px;color:var(--ink2)}
.mimg{overflow:auto;max-height:340px;background:#fff}
.mcard>.row{margin-top:auto}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.pal button{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:5px 8px;cursor:pointer;text-align:left;font-size:12px;line-height:1.3}
.pal button.on{border-color:var(--rose);background:var(--rose2);font-weight:700}
.pal svg{flex:0 0 auto}
.etools .vsep{width:1px;height:24px;background:var(--line2);margin:0 4px}
.ewrap{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px){.ewrap{grid-template-columns:minmax(0,1fr) 300px}}
.ecanvas{overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff;cursor:crosshair;touch-action:none}
.etile{border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface-sub)}
.etile h3{margin:6px 0 2px}
.etile #etile{overflow:auto;background:#fff;border-radius:8px;padding:4px}
.rows{font-size:13px;padding-left:20px}

/* 차트 */
.ctl{gap:4px 12px}
.copts{margin:8px 0 0}
.copts summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink2);padding:4px 0;user-select:none}
.zoom{display:flex;align-items:center;gap:6px;font-size:14px}
.zoom input{accent-color:var(--rose)}
.rowbar{position:sticky;top:calc(var(--hdr-h) + var(--tabs-h));z-index:5;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;box-shadow:var(--shadow)}
.rb1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rjump{display:flex;align-items:center;gap:4px;border:1px solid var(--line2);border-radius:10px;padding:0 8px;background:#fff}
.rjump input{width:62px;border:0;outline:0;padding:7px 2px;text-align:right;font-weight:700;background:transparent}
.prog{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px}
.pbar{display:inline-block;width:120px;height:8px;border-radius:5px;background:var(--surface-sub);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--rose);border-radius:5px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badges:empty{display:none}
.badge{font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;background:var(--surface-sub);color:var(--ink)}
.b-shape{background:var(--rose2);color:var(--rose)}
.b-cross{background:#F5E6C8;color:#6B4E16}
.b-rib{background:#EAE4DC}
.b-split{background:#EDE7F2;color:#4B3A63}
.b-end{background:var(--accent2);color:var(--accent)}
.rtext{font-size:14px;margin-top:8px;line-height:1.6}
.chartbox{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px;cursor:grab;-webkit-user-select:none;user-select:none}
.chartbox.panning{cursor:grabbing}
.chartbox svg{display:block;max-width:none}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px}
.lg svg{flex:0 0 auto}

/* 도식화 */
.schem{overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-sub);font-size:13px}
.sched{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
.sched summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px}
.sched[open] summary{border-bottom:1px solid var(--line)}
.sched .tbl{font-size:13px}
.sched .tbl td:first-child,.sched .tbl td:last-child{white-space:nowrap}

/* 그레이딩 */
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:8px 0}
.grade{font-size:13px}
.grade th,.grade td{white-space:nowrap}
.grade td:first-child{font-weight:700;position:sticky;left:0;background:#fff}
.grade thead th{background:var(--ink);color:#fff;text-align:center}
.grade thead th:first-child{background:var(--ink)}
.grade th.cur{background:var(--rose)}
.grade td.cur{background:var(--rose2)}
.grade tr.gh td{background:var(--surface-sub);font-weight:700;color:var(--ink)}

/* 서술형 */
.doc h1{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin:4px 0 8px}
.doc h2{font-size:18px;border-top:2px solid var(--gold);padding-top:10px;margin:22px 0 8px}
.doc h3{font-size:15px}
.doc p,.doc li{font-size:15px}
.doc ul{padding-left:20px}
.tick{cursor:pointer;border-radius:8px;padding:2px 6px 2px 28px;margin-left:-6px;position:relative;transition:background .15s}
.doc ul .tick{margin-left:-20px}
.tick:hover{background:var(--surface-sub)}
.tick::before{content:'';position:absolute;left:6px;top:.45em;width:14px;height:14px;border:1.5px solid var(--line2);border-radius:4px;background:#fff}
.doc ul{list-style:none}
.tick.done{text-decoration:line-through;color:var(--ink2)}
.tick.done::before{background:var(--night);border-color:var(--night)}
.tick.done::after{content:'';position:absolute;left:10.5px;top:calc(.45em + 2px);width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

.welcome{border-color:var(--gold);background:var(--card)}
.welcome .whead{display:flex;align-items:center;gap:14px}
.welcome .whead svg{width:64px;height:64px;flex:0 0 auto}
.welcome .hand{font-family:var(--hand);font-size:24px;line-height:1.1}
.welcome .hand .h1{color:var(--accent)}.welcome .hand .h2{color:#C98F1E}.welcome .hand .h3{color:#2C9A86}
.welcome .en{font-family:var(--hand);font-size:18px;color:var(--ink)}
.welcome ol{margin:4px 0 0;padding-left:20px}
.welcome li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;opacity:0;transition:.25s;pointer-events:none;z-index:60;font-size:14px;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(28,25,23,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(28,25,23,.18)}

@media (max-width:640px){
  :root{--hdr-h:auto}
  body{font-size:14px}
  .top{position:static;height:auto;flex-wrap:wrap;padding:10px 12px;gap:8px}
  .sub{font-size:18px}
  .pname{width:130px}
  .tabs{top:0;padding:0 6px}
  .tgl{display:none}
  .tabs button{padding:7px 9px}
  .tabs button span{font-size:13px}
  .rowbar{top:var(--tabs-h)}
  main{padding:12px 10px 80px}
  .card{padding:14px 12px;border-radius:14px}
  .mh,.mr{grid-template-columns:1fr 1fr .7fr;padding:8px 10px;row-gap:6px}
  .mh span:first-child{display:none}
  .mn{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
  .mn i{display:inline;font-size:12px}
  .grid{grid-template-columns:1fr 1fr}
  .prog{margin-left:0;width:100%}
  .pbar{flex:1}
  .rowbar{padding:8px 10px}
  .rtext{max-height:4.9em;overflow:auto;font-size:13px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ===================== 코와단 도안 엔진 ===================== */
const even = x => 2 * Math.round(x / 2);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const r1 = x => Math.round(x * 10) / 10;
const fmt = x => { const v = r1(x); return Number.isInteger(v) ? String(v) : v.toFixed(1); };

/* ---------- 기호 정의 ---------- */
const STITCH = {
  k: { name: '겉뜨기', ws: '안뜨기', how: '바늘을 코의 앞쪽에서 넣어 겉뜨기합니다.' },
  p: { name: '안뜨기', ws: '겉뜨기', how: '실을 앞에 두고 안뜨기합니다.' },

  const ribCenter = (first.l + rows[1][rows[1].length - 1].r) / 2;
  const ribOdd = ((rows[1][rows[1].length - 1].r - first.l + 1) % 2) === 1;
  for (let r = 1; r <= total; r++) {
    const row = Array(W).fill(null);
    (rows[r] || []).forEach(s => {
      for (let c = s.l; c <= s.r; c++) {
        let code;
        if (r <= ribRows) code = (c === s.l || c === s.r) ? 'k' : ribCode(ribType, c, ribCenter, ribOdd, r);
        else if (c === s.l || c === s.r) code = 'k';
        else {
          code = bgCode(bg, r, c);
          for (const p of placements) {
            if (c >= p.x0 && c < p.x0 + p.w && r >= p.y0) {
              if (p.kind === 'purl') { code = 'p'; break; }
              if (p.kind === 'bg') break;
              const mr = (r - p.y0) % p.ex.h;
              const cell = p.ex.cells[mr][c - p.x0];
              code = typeof cell === 'object' ? { ...cell } : cell;
              break;
            }
          }
        }
        row[c] = code;
      }
    });
    codes[r] = row;
  }
  marks.forEach((code, key) => {
    const r = Math.floor(key / 10000), c = key % 10000;
    if (codes[r] && codes[r][c] !== null && codes[r][c] !== undefined) codes[r][c] = code;
  });
  if (finalBo) { const r = total; codes[r] = codes[r].map(v => v === null ? null : 'bo'); }
  // 교차 검증
  const segOf = (r, c) => (rows[r] || []).find(s => c >= s.l && c <= s.r);
  for (let r = 1; r <= total; r++) {
    const row = codes[r];
    for (let c = 0; c < W; c++) {
      const v = row[c];
      if (v && typeof v === 'object') {
        const x = parseTok(v.tok);
        let ok = v.j === 0 && r % 2 === 1;
        const sg = segOf(r, c);
        if (ok) for (let j = 1; j < x.w; j++) {
          const u = row[c + j];
          if (!(u && typeof u === 'object' && u.tok === v.tok && u.j === j) || !sg || c + j > sg.r) { ok = false; break; }
        }
        if (ok && sg && (c === sg.l || c + x.w - 1 === sg.r)) ok = false;
        if (ok) { row[c] = v.tok; for (let j = 1; j < x.w; j++) row[c + j] = '>'; c += x.w - 1; }
        else row[c] = crossOut(v.tok, v.j);
      }
    }
  }
  pc.codes = codes;
  pc.total = total;
  return pc;
}

/* ---------- 메인 계산 ---------- */
function compute(P, motifLib) {
  const W_ = [], notes = [];
  const warn = s => W_.push(s);
  const gs = P.gauge.unit === '10cm' ? P.gauge.st / 10 : P.gauge.st;
  const gr = P.gauge.unit === '10cm' ? P.gauge.row / 10 : P.gauge.row;
  const dens = P.gauge.dens || 1.2;
  const b = P.body, e = P.ease, d = P.design, pat = P.pattern;
  const isCard = P.garment === 'cardigan';
  const isV = P.neck === 'v';
  const isDrop = P.sleeve === 'drop';
  const rowsOf = cm => Math.max(2, even(cm * gr));
  // 입력 범위 확인 (오타, 단위 착오 잡기)
  const RANGE = { chest: ['가슴둘레', 40, 170], hip: ['엉덩이둘레', 40, 180], shoulder: ['어깨너비', 20, 60], armDepth: ['진동깊이', 9, 30], neckW: ['목너비', 8, 25], armLen: ['팔길이', 20, 80], upperArm: ['위팔둘레', 12, 55], wrist: ['손목둘레', 8, 28] };
  Object.keys(RANGE).forEach(k => { const [n, lo, hi] = RANGE[k], v = P.body[k]; if (v < lo || v > hi) warn(`${n} ${v}cm가 보통 범위(${lo}~${hi}cm)를 벗어납니다. 입력을 확인하세요.`); });
  if (P.design.length < 25 || P.design.length > 100) warn(`총장 ${P.design.length}cm가 보통 범위(25~100cm)를 벗어납니다. 입력을 확인하세요.`);
  if (gs * 10 < 8 || gs * 10 > 45) warn(`게이지 코 수(10cm에 ${r1(gs * 10)}코)가 보통 범위(8~45코)를 벗어납니다. 게이지 단위(1cm/10cm)를 확인하세요.`);
  if (gr < gs * 0.9) warn('게이지 단 수가 코 수보다 적습니다. 코와 단을 바꿔 넣지 않았는지 확인하세요.');
  if (P.gauge.dens && (P.gauge.dens < 1 || P.gauge.dens > 1.5)) warn(`꽈배기 수축 비율 ${P.gauge.dens}배는 보통 범위(1.0~1.5배)를 벗어납니다.`);

  // 완성 목표 치수
  const T = {
    chest: b.chest + e.chest, hip: b.hip + e.hip, shoulder: b.shoulder + e.shoulder,
    armDepth: b.armDepth + e.armDepth, neckW: b.neckW + e.neckW, armLen: b.armLen + e.armLen,
    upper: b.upperArm + e.upperArm, wrist: b.wrist + e.wrist, length: d.length,
  };
  if (T.neckW >= T.shoulder - 6) warn('목너비가 어깨너비에 비해 너무 넓습니다. 어깨 코가 부족할 수 있습니다.');
  if (T.shoulder > T.chest / 2 && !isDrop) warn('어깨너비가 가슴 반둘레보다 넓습니다. 드롭숄더를 고려하세요.');

  const layFull = makeLayout(pat, motifLib, 'full');
  const layBack = makeLayout(pat, motifLib, pat.applyBack ? 'full' : 'none');
  const layOne = makeLayout(pat, motifLib, 'center');
  const laySleeve = makeLayout(pat, motifLib, pat.applySleeve ? 'center' : 'none');
  const layFront = isCard ? layOne : layFull;

  const ribRows = rowsOf(d.ribH);
  const ahRows = rowsOf(T.armDepth);
  const totalRows = rowsOf(T.length);
  const sideRows = totalRows - ribRows - ahRows;
  if (sideRows < 10) warn('총장이 너무 짧아 옆선 길이가 부족합니다.');

  const pieces = [];
  const shoulderKind = d.shoulderMethod === 'sr' ? 'sr' : 'bo';

  // ---- 몸판 공통 계산 ----
  function bodyPlan(lay, halfFactor, label) {
    // halfFactor: 1 => 앞/뒤판 전체 폭(반둘레), 0.5 => 가디건 한쪽
    const bandHalf = isCard && halfFactor === 0.5 ? d.bandW / 2 : 0;
    const wChest = T.chest / 2 * halfFactor - bandHalf;
    const wHip = T.hip / 2 * halfFactor - bandHalf;
    const Nc = stsFor(wChest, lay, gs, dens);
    let Nh = stsFor(wHip, lay, gs, dens);
    return { Nc, Nh, wChest, wHip };
  }
  // 뒤판 기준 어깨/진동 코 계산
  const backP = bodyPlan(layBack, 1);
  const shoulderBase = isDrop ? cmFor(backP.Nc, layBack, gs, dens) : T.shoulder;
  const shSts = Math.max(4, Math.round(((shoulderBase - T.neckW) / 2) * gs));
  let NshBack = isDrop ? backP.Nc : stsFor(T.shoulder, layBack, gs, dens);
  if (NshBack > backP.Nc) NshBack = backP.Nc;
  const A = (backP.Nc - NshBack) / 2; // 진동 줄임 코 (한쪽)
  const neckStsBack = NshBack - 2 * shSts;
  if (neckStsBack < 6) warn('목 코 수가 너무 적습니다. 목너비나 어깨너비를 확인하세요.');

  // 어깨 단계
  const sdRows = rowsOf(d.shoulderDrop);
  const kSteps = clamp(Math.round(sdRows / 2), 2, Math.min(4, shSts));
  const shParts = Array.from({ length: kSteps }, (_, i) => Math.floor(shSts / kSteps) + (i < shSts % kSteps ? 1 : 0));
  const shStart = totalRows - 2 * kSteps + 1;
  const ahStart = ribRows + sideRows + 1;

  // 진동 단계: 덮어씌우기 후 2단마다 1코 6회, 나머지는 4단마다. 어깨 경사 4단 전까지 들어가도록 조정
  function armholeBlocks(A) {
    const out = []; let rem = A;
    if (rem <= 0) return out;
    const budget = shStart - ahStart - 4;
    if (rem >= 4) { const b0 = clamp(Math.round(A * 0.35), 2, 6); out.push({ len: 2, amt: b0, kind: 'bo' }); rem -= b0; }
    if (rem >= 5) { out.push({ len: 2, amt: 2, kind: 'bo' }); rem -= 2; }
    while (rem >= 4 && 2 * (out.length + rem) > budget) { out.push({ len: 2, amt: 2, kind: 'bo' }); rem -= 2; }
    const n4 = Math.max(0, Math.min(rem - 6, Math.floor((budget - 2 * (out.length + rem)) / 2)));
    for (let i = 0; i < rem; i++) out.push({ len: i >= rem - n4 ? 4 : 2, amt: 1, kind: 'dec' });
    return out;
  }
  const ahBlocks = armholeBlocks(A);
  const ahUsed = ahBlocks.reduce((a, x) => a + x.len, 0);
  if (ahStart + ahUsed > shStart - 4) warn('진동 줄임이 어깨 경사와 겹칩니다. 진동깊이를 늘리거나 어깨너비를 넓히세요.');

  // 옆선 쉐이핑(밑단 -> 가슴)
  function sideShaping(Nh, Nc, oneSide) {
    const dd = oneSide ? (Nc - Nh) : (Nc - Nh) / 2;
    if (dd === 0) return { events: [], blocks: [], F: 0, kind: null, n: 0 };
    let F = Math.min(rowsOf(4), Math.max(0, sideRows - 4));
    let H = Math.max(2, sideRows - F - rowsOf(3));
    if (2 * Math.abs(dd) > H) { F = 0; H = Math.max(2, sideRows - 2); } // 촘촘하면 평단을 줄여 옆선 전체에 배분
    const blocks = fitBlocks(H, Math.abs(dd));
    if (blocks.some(x => x.amt >= 2)) warn(`밑단과 가슴 폭 차이가 커서 옆선에서 2코씩 ${dd > 0 ? '늘리는' : '줄이는'} 단이 있습니다. 밑단둘레나 가슴 여유를 확인하세요.`);
    return { blocks, F, kind: dd > 0 ? 'inc' : 'dec', n: Math.abs(dd) };
  }

  // 목 줄임 계산
  function roundNeck(neckSts, depthRows) {
    const maxEv = Math.max(1, Math.floor((depthRows - 4) / 2));
    let fs = Math.round(neckSts * 0.33);
    let center = neckSts - 2 * fs;
    if (center < 2) { fs = Math.floor((neckSts - 2) / 2); center = neckSts - 2 * fs; }
    const amts = neckSide(fs, maxEv);
    return { center, fs, amts };
  }

  /* ===== 몸판 조각 생성 ===== */
  function makeBody(id, name, lay, kind) {
    // kind: 'back' | 'front' | 'rfront' | 'lfront'
    const half = kind === 'rfront' || kind === 'lfront';
    const pl = bodyPlan(lay, half ? 0.5 : 1);
    const Nc = pl.Nc, Nh = pl.Nh;
    const Ash = half ? A : A; // 한쪽 진동 줄임 동일
    const W = Math.max(Nc, Nh);
    const l0 = (W - Nh) / 2;
    const ops = {}, splits = {}, info = { Nc, Nh, wChest: pl.wChest, wHip: pl.wHip };
    // 옆선
    const ss = sideShaping(Nh, Nc, half);
    const sideEdges = kind === 'rfront' ? [{ seg: 'main', edge: 'left' }] : kind === 'lfront' ? [{ seg: 'main', edge: 'right' }] : [{ seg: 'main', edge: 'left' }, { seg: 'main', edge: 'right' }];
    const centerEdge = kind === 'rfront' ? [{ seg: 'main', edge: 'right' }] : kind === 'lfront' ? [{ seg: 'main', edge: 'left' }] : [];
    if (ss.blocks.length) {
      addEvents(ops, blocksToEvents(ribRows + 1 + ss.F, ss.blocks, ss.kind), sideEdges);
      // 가디건 앞판은 옆선만 조정 -> 앞중심 쪽은 반영 안 함 (중심선 직선)
    }
    info.side = ss;
    // 진동
    const ahEdges = sideEdges;
    addEvents(ops, blocksToEvents(ahStart, ahBlocks, 'dec'), ahEdges);
    info.ahBlocks = ahBlocks;
    // 어깨
    const shBlocks = shParts.map(a => ({ len: 2, amt: a, kind: shoulderKind }));
    const shEdges = kind === 'rfront' ? [{ seg: 'main', edge: 'left' }] : kind === 'lfront' ? [{ seg: 'main', edge: 'right' }] : [{ seg: 'main', edge: 'left' }, { seg: 'main', edge: 'right' }];
    addEvents(ops, blocksToEvents(shStart, shBlocks, shoulderKind), shEdges);
    info.shBlocks = shBlocks;
    // 목
    const centerCol = (W - 1) / 2;
    const NshThis = (half ? Nc - A : Nc - 2 * A);
    const neckSts = half ? NshThis - shSts : NshThis - 2 * shSts;
    info.neckSts = neckSts; info.Nsh = NshThis;
    if (kind === 'back') {
      const nb = Math.max(4, rowsOf(d.backNeckD)); // 나눈 단 + 줄임 단이 들어갈 최소 단수
      const s = totalRows - nb + 1;
      const maxEv = Math.max(1, nb / 2 - 1);
      const bs = clamp(Math.round(neckSts * 0.15), 2, 4);
      const amts = mergeToFit(bs, maxEv, 0);
      const center = neckSts - 2 * bs;
      const a = Math.round(centerCol - (center - 1) / 2);
      splits[s] = { a, b: a + center - 1 };
      const blocks = amts.map(x => ({ len: 2, amt: x, kind: x >= 2 ? 'bo' : 'dec' }));
      addEvents(ops, blocksToEvents(s + 2, blocks, 'dec'), [{ seg: 'L', edge: 'right' }, { seg: 'R', edge: 'left' }]);
      info.neck = { type: 'back', s, center, blocks, depthRows: nb };
    } else if (kind === 'front' && !isV) {
      const nf = Math.max(6, rowsOf(d.frontNeckD));
      const s = totalRows - nf + 1;
      const rn = roundNeck(neckSts, nf);
      const a = Math.round(centerCol - (rn.center - 1) / 2);
      splits[s] = { a, b: a + rn.center - 1 };
      const blocks = rn.amts.map(x => ({ len: 2, amt: x, kind: x >= 2 ? 'bo' : 'dec' }));
      addEvents(ops, blocksToEvents(s + 2, blocks, 'dec'), [{ seg: 'L', edge: 'right' }, { seg: 'R', edge: 'left' }]);
      info.neck = { type: 'round', s, center: rn.center, blocks, depthRows: nf };
    } else if (kind === 'front' && isV) {
      const nv = Math.max(8, rowsOf(d.vDepth));
      const s = totalRows - nv + 1;
      const odd = neckSts % 2 === 1;
      const fs = Math.floor(neckSts / 2);
      const mid = Math.floor(W / 2);
      if (odd) splits[s] = { a: Math.round(centerCol), b: Math.round(centerCol) };
      else splits[s] = { a: mid, b: mid - 1 }; // 0코 덮어씌우기
      const H = nv - 6;
      const blocks = vBlocks(H, fs);
      addEvents(ops, blocksToEvents(s + 2, blocks, 'dec'), [{ seg: 'L', edge: 'right' }, { seg: 'R', edge: 'left' }]);
      info.neck = { type: 'v', s, center: odd ? 1 : 0, blocks, depthRows: nv };
    } else if (half) {
      const neckRows = isV ? Math.max(8, rowsOf(d.vDepth)) : Math.max(6, rowsOf(d.frontNeckD));
      const s = totalRows - neckRows + 1;
      let blocks;
      if (isV) {
        const H = neckRows - 6;
        blocks = vBlocks(H, neckSts);
        addEvents(ops, blocksToEvents(s, blocks, 'dec'), centerEdge);
      } else {
        const maxEv = Math.max(2, Math.floor((neckRows - 4) / 2));
        const ch = Math.max(2, Math.round(neckSts * 0.34));
        const amts = [ch, ...neckSide(neckSts - ch, maxEv - 1)];
        blocks = amts.map(x => ({ len: 2, amt: x, kind: x >= 2 ? 'bo' : 'dec' }));
        addEvents(ops, blocksToEvents(s, blocks, 'dec'), centerEdge);
      }
      info.neck = { type: isV ? 'v-half' : 'round-half', s, blocks, depthRows: neckRows };
    }
    const sim = simulate(W, l0, l0 + Nh - 1, totalRows, ops, splits);
    if (sim.left) warn(`${name}: 마지막 단 뒤에 ${sim.left}코가 남습니다. 치수를 확인하세요.`);
    // 무늬 배치
    const placements = [];
    let x = Math.round((W - lay.panelW) / 2);
    lay.blocks.forEach(bk => {
      if (bk.type === 'motif') placements.push({ kind: 'motif', x0: x, w: bk.w, y0: ribRows + 1, ex: expandMotif(bk.motif), motif: bk.motif });
      else placements.push({ kind: bk.type, x0: x, w: bk.w, y0: ribRows + 1 });
      x += bk.w;
    });
    const pc = { id, name, W, rows: sim.rows, marks: sim.marks, ribRows, ribType: pat.rib, bg: pat.bg, placements, lay, info, kind };
    fillPiece(pc);
    return pc;
  }

  const back = makeBody('back', '뒤판', layBack, 'back');
  pieces.push(back);
  if (isCard) {
    pieces.push(makeBody('rfront', '오른앞판', layOne, 'rfront'));
    const lay2 = { blocks: layOne.blocks.map(bk => bk.type === 'motif' ? { ...bk, motif: mirrorMotif(bk.motif) } : bk), panelW: layOne.panelW, cableSts: layOne.cableSts };
    pieces.push(makeBody('lfront', '왼앞판', lay2, 'lfront'));
  } else {
    pieces.push(makeBody('front', '앞판', layFront, 'front'));
  }

  // 진동 둘레 (뒤판 오른쪽 가장자리, 진동 시작 ~ 어깨 경사 시작)
  const ahLen = seamLen(back.rows, ahStart, shStart - 1, 'right', gs, gr);

  /* ===== 소매 ===== */
  const cuffRows = rowsOf(d.cuffH);
  const Ncuff = stsFor(T.wrist, laySleeve, gs, dens);
  let upperCm = T.upper, sleeveLen = T.armLen;
  const bodyChestCm = cmFor(back.info.Nc, layBack, gs, dens);
  const shoulderCm = isDrop ? bodyChestCm : cmFor(NshBack, layBack, gs, dens);
  if (isDrop) {
    const ahCm = ahRows / gr;
    if (2 * ahCm < T.upper) warn('드롭숄더 진동깊이 x 2가 위팔둘레(여유 포함)보다 작습니다. 진동깊이를 늘리세요.');
    upperCm = 2 * ahCm;
    sleeveLen = T.armLen - (bodyChestCm - T.shoulder) / 2;
  }
  let Nup = stsFor(upperCm, laySleeve, gs, dens);
  if (Nup < Ncuff) { warn('위팔둘레가 손목둘레보다 작게 계산되어 소매를 늘림 없이 곧게 뜹니다. 위팔둘레와 손목둘레를 확인하세요.'); Nup = Ncuff; }
  if ((Nup - Ncuff) % 2) Nup++;

  function sleeveBuild(capRows, capPlan) {
    const underRows = Math.max(4, rowsOf(sleeveLen) - capRows - cuffRows);
    const total = cuffRows + underRows + capRows;
    const W = Math.max(Nup, Ncuff);
    const l0 = (W - Ncuff) / 2;
    const ops = {};
    const di = (Nup - Ncuff) / 2;
    let F = Math.min(rowsOf(2), Math.max(0, underRows - 4));
    let H = Math.max(2, underRows - F - rowsOf(3));
    if (2 * di > H) { F = 0; H = Math.max(2, underRows - 2); }
    const incBlocks = fitBlocks(H, di);
    addEvents(ops, blocksToEvents(cuffRows + 1 + F, incBlocks, 'inc'), [{ seg: 'main', edge: 'left' }, { seg: 'main', edge: 'right' }]);
    const capStart = cuffRows + underRows + 1;
    if (capPlan) addEvents(ops, blocksToEvents(capStart, capPlan, 'dec'), [{ seg: 'main', edge: 'left' }, { seg: 'main', edge: 'right' }]);
    const sim = simulate(W, l0, l0 + Ncuff - 1, total, ops, {});
    return { W, sim, total, underRows, capStart, incBlocks, F, H, ivOver: incBlocks.some(x => x.amt >= 2) };
  }
  function capPlanFor(hc) {
    const init = ahBlocks.filter(x => x.kind === 'bo').map(x => ({ ...x }));
    const initSum = init.reduce((a, x) => a + x.amt, 0);
    const topTarget = stsFor(d.capTop, laySleeve, gs, dens);
    const topSts = Nup - 2 * Math.floor((Nup - topTarget) / 2);
    const rem = (Nup - topSts) / 2 - initSum;
    if (rem < 0) return null;
    const Hc = hc - 2 * init.length - 2;
    const E = Math.floor(Hc / 2);
    if (E < 1) return null;
    let body;
    if (rem > E) { // 가파른 소매산: 일부를 2코 덮어씌우기로
      const amts = Array(E).fill(1);
      let extra = rem - E, i = 0;
      while (extra > 0) { const j = Math.floor(i / 2) % E; const k = i % 2 === 0 ? j : E - 1 - j; amts[k]++; extra--; i++; if (i > 8 * E) break; }
      if (extra > 0) return null;
      body = amts.map(a => ({ len: 2, amt: a, kind: a >= 2 ? 'bo' : 'dec' }));
    } else {
      const tail = rem >= 12 ? [2, 2] : rem >= 7 ? [2] : [];
      const md = rem - tail.reduce((a, x) => a + x, 0);
      const Hm = Hc - 2 * tail.length;
      const iv = distribute(Hm, md);
      const mid = iv.map(len => ({ len, amt: 1, kind: 'dec' }));
      const twos = mid.filter(x => x.len === 2), others = mid.filter(x => x.len !== 2);
      const half = Math.ceil(twos.length / 2);
      body = [...twos.slice(0, half), ...others, ...twos.slice(half), ...tail.map(a => ({ len: 2, amt: a, kind: 'bo' }))];
    }
    const blocks = [...init, ...body];
    const consumed = blocks.reduce((a, x) => a + x.len, 0);
    if (consumed > hc) return null;
    return { blocks, topSts };
  }

  let sleeve, capInfo = null;
  if (!isDrop) {
    let best = null;
    const tryCap = (lo, hi) => { for (let hc = lo; hc <= hi; hc += 2) {
      const cp = capPlanFor(hc); if (!cp) continue;
      const sb = sleeveBuild(hc, cp.blocks);
      const capEdge = seamLen(sb.sim.rows, sb.capStart, sb.total, 'right', gs, gr);
      const topCm = cp.topSts / gs;
      const capTotal = 2 * capEdge + topCm;
      const armTotal = 2 * ahLen;
      const easeC = capTotal - armTotal;
      const score = Math.abs(easeC - 1.5) + Math.max(0, cp.blocks.filter(x => x.amt >= 2).length - 4) * 0.4;
      if (!best || score < best.score) best = { hc, cp, sb, capTotal, armTotal, easeC, score };
    } };
    tryCap(Math.max(6, even(0.5 * ahRows)), even(0.85 * ahRows));
    // 굵은 실, 큰 여유처럼 기본 범위(진동깊이 50~85%)로 맞지 않을 때만 35~95%로 넓힘
    if (!best || best.easeC > 3) tryCap(Math.max(6, even(0.35 * ahRows)), even(0.5 * ahRows) - 2);
    if (!best || best.easeC < -0.5) tryCap(even(0.85 * ahRows) + 2, even(0.95 * ahRows));
    if (!best) {
      warn('소매산을 진동둘레에 맞출 수 없어 기본값으로 계산했습니다. 위팔둘레, 진동깊이, 소매산 윗폭을 확인하세요.');
      const hc = even(0.65 * ahRows);
      const sb = sleeveBuild(hc, null);
      sleeve = sb; capInfo = { hc, blocks: [], topSts: Nup, easeC: 0, capTotal: 0, armTotal: 2 * ahLen };
    } else {
      sleeve = best.sb; capInfo = { hc: best.hc, blocks: best.cp.blocks, topSts: best.cp.topSts, easeC: best.easeC, capTotal: best.capTotal, armTotal: best.armTotal };
    }
  } else {
    sleeve = sleeveBuild(0, null);
    capInfo = null;
  }
  if (capInfo && capInfo.blocks.length && capInfo.easeC > 3) warn(`소매산 둘레가 진동 둘레보다 ${fmt(capInfo.easeC)}cm 깁니다(권장 0~3cm). 위팔 여유를 줄이거나 진동깊이를 늘리면 소매산이 자연스러워집니다.`);
  if (capInfo && capInfo.blocks.length && capInfo.easeC < -0.5) warn(`소매산 둘레가 진동 둘레보다 ${fmt(-capInfo.easeC)}cm 짧습니다. 위팔 여유를 늘리거나 소매산 윗폭을 넓히세요.`);
  if (sleeve.ivOver) warn('소매 늘림이 촘촘해 2코씩 늘리는 단이 있습니다. 소매길이나 위팔 여유를 확인하세요.');
  const sPlacements = [];
  {
    let x = Math.round((sleeve.W - laySleeve.panelW) / 2);
    laySleeve.blocks.forEach(bk => {
      if (bk.type === 'motif') sPlacements.push({ kind: 'motif', x0: x, w: bk.w, y0: cuffRows + 1, ex: expandMotif(bk.motif), motif: bk.motif });
      else sPlacements.push({ kind: bk.type, x0: x, w: bk.w, y0: cuffRows + 1 });
      x += bk.w;
    });
  }
  const sleevePc = {
    id: 'sleeve', name: '소매 (2장)', W: sleeve.W, rows: sleeve.sim.rows, marks: sleeve.sim.marks, ribRows: cuffRows, ribType: pat.rib, bg: pat.bg,
    placements: sPlacements, lay: laySleeve, finalBo: true, kind: 'sleeve',
    info: { Ncuff, Nup, underRows: sleeve.underRows, capStart: sleeve.capStart, incBlocks: sleeve.incBlocks, F: sleeve.F, cap: capInfo, upperCm, sleeveLen }
  };
  fillPiece(sleevePc);
  pieces.push(sleevePc);

  /* ===== 완성 치수 ===== */
  const frontPc = pieces.find(p => p.kind === 'front' || p.kind === 'rfront');
  const finished = {
    chest: isCard ? bodyChestCm + 2 * cmFor(frontPc.info.Nc, frontPc.lay, gs, dens) + d.bandW : bodyChestCm + cmFor(frontPc.info.Nc, frontPc.lay, gs, dens),
    hem: isCard ? cmFor(back.info.Nh, layBack, gs, dens) + 2 * cmFor(frontPc.info.Nh, frontPc.lay, gs, dens) + d.bandW : cmFor(back.info.Nh, layBack, gs, dens) + cmFor(frontPc.info.Nh, frontPc.lay, gs, dens),
    length: totalRows / gr, armDepth: ahRows / gr, shoulder: shoulderCm,
    neckW: cmFor(NshBack, layBack, gs, dens) - 2 * shSts / gs,
    sleeveLen: sleeve.total / gr, upper: cmFor(Nup, laySleeve, gs, dens), cuff: cmFor(Ncuff, laySleeve, gs, dens),
    ribH: ribRows / gr, cuffH: cuffRows / gr,
  };

  /* ===== 넥밴드 / 앞단 ===== */
  function neckOpening(pc) {
    const nk = pc.info.neck; if (!nk) return 0;
    const lastL = pc.rows.length - 1;
    const Lside = edgeLen(pc.rows, nk.s + 1, lastL, 'right', gs, gr, segs => segs.find(s => s.name === 'L'));
    const Rside = edgeLen(pc.rows, nk.s + 1, lastL, 'left', gs, gr, segs => segs.find(s => s.name === 'R'));
    return Lside + Rside + (nk.center || 0) / gs;
  }
  let neckCirc;
  if (isCard) {
    const fr = pieces.find(p => p.kind === 'rfront');
    const frontNeck = edgeLen(fr.rows, fr.info.neck.s, fr.rows.length - 1, 'right', gs, gr) ;
    neckCirc = neckOpening(back) + 2 * frontNeck - 2 * shSts / gs * 0; // 앞판 목선
  } else neckCirc = neckOpening(back) + neckOpening(frontPc);
  const nbRows = rowsOf(d.neckbandH);
  const ribMult = pat.rib === '2x2' ? 4 : 2;
  let neckPick = Math.round(neckCirc * gs * 0.92 / ribMult) * ribMult;

  let band = null;
  if (isCard) {
    const fr = pieces.find(p => p.kind === 'rfront');
    const edgeCm = (fr.info.neck.s - 1 + (isV ? 0 : nbRows)) / gr; // 라운드넥은 넥밴드 끝까지, V넥은 목선 시작까지
    let pick = Math.round(edgeCm * gs * 0.9);
    if (pat.rib === '2x2') pick = Math.round((pick - 2) / 4) * 4 + 2; else pick = pick % 2 ? pick : pick + 1;
    const nb = Math.max(2, d.buttons || 6);
    const first = 3, last = pick - 3;
    const pos = Array.from({ length: nb }, (_, i) => Math.round(first + (last - first) * i / (nb - 1)));
    band = { edgeCm, pick, pos, rows: rowsOf(d.bandW), nb };
    if (!isV) neckPick = neckPick; // 넥밴드는 앞단 포함하여 줍기
  }

  /* ===== 실 사용량 ===== */
  let cells = 0;
  pieces.forEach(pc => { const mult = pc.kind === 'sleeve' ? 2 : 1; pc.codes.forEach(row => { if (row) row.forEach(v => { if (v) cells += mult; }); }); });
  cells += neckPick * nbRows + (band ? band.pick * band.rows * 2 : 0);
  const sw = P.gauge.swatchW;
  const gSw = P.gauge.unit === '10cm' ? P.gauge.st * P.gauge.row : P.gauge.st * P.gauge.row * 100;
  const yarnG = sw ? cells / gSw * sw * 1.08 : null;

  return {
    pieces, warnings: W_, T, finished, gs, gr, dens, ribRows, ahRows, totalRows, sideRows, ahStart, shStart, shSts, shParts, A, NshBack,
    ahLen, cuffRows, capInfo, neckPick, nbRows, neckCirc, band, yarnG, cells, layFull, layBack, laySleeve, layFront, isCard, isV, isDrop,
  };
}

/* ===================== 서술형 도안 ===================== */
function runsText(tokens, ws) {
  // tokens: 칸 기준 진행 순서 배열 (이미 읽는 방향 정렬)
  const out = []; let i = 0;
  while (i < tokens.length) {
    const t = tokens[i];
    if (parseTok(t)) { out.push(crossName(t)); i++; continue; }
    let j = i; while (j < tokens.length && tokens[j] === t) j++;
    const n = j - i;
    const nm = ws ? (STITCH[t] ? STITCH[t].ws : t) : (STITCH[t] ? STITCH[t].name : t);
    out.push(n > 1 ? `${nm} ${n}코` : `${nm} 1코`);
    i = j;
  }
  return out.join(', ');
}
function motifRowsText(m) {
  return m.rows.map((row, i) => {
    const rs = i % 2 === 0;
    const seq = rs ? row.slice().reverse() : row.slice();
    return `${i + 1}단(${rs ? '겉면' : '안면'}): ${runsText(seq, !rs)}`;
  });
}
function blocksDesc(lay, bg) {
  // 겉면 1단 기준, 오른쪽부터
  const list = lay.blocks.filter(b => b.w > 0).slice().reverse().map(b => {
    if (b.type === 'motif') return `${b.motif._label || b.motif.name} ${b.w}코`;
    if (b.type === 'purl') return `안뜨기 ${b.w}코`;
    return `${BG_NAME[bg]} ${b.w}코`;
  });
  return list;
}

    if (!isSleeve) {

      else Pp(`소매는 늘림 없이 ${info.Nup}코로 곧게 뜹니다.`);

      if (info.cap) Pp(`소매산: 양쪽에서 ${notation(info.cap.blocks)} 줄인 뒤 남은 ${info.cap.topSts}코를 모두 덮어씌웁니다. 소매산 높이 ${cm(info.cap.hc)}cm(${info.cap.hc}단).`);

    }
  });

  H2('마무리');
  Li(P.design.shoulderMethod === 'sr' ? '앞판과 뒤판의 어깨 쉼코를 겉끼리 마주 대고 빼뜨기로 잇습니다.' : '앞판과 뒤판의 어깨를 떠서 꿰매기로 잇습니다.');

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600); }
const safeName = s => String(s || '도안').replace(/[\\/:*?"<>|]/g, '').trim() || '도안';

/* ===================== 저장소 ===================== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('kowadan.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kowadan.' + k, JSON.stringify(v)); } catch (e) { } },
};
const Store = {
  db: null, unsubs: [],
  async init() {
    S.projects = LS.get('projects', []);
    S.motifs = LS.get('motifs', []);
    // 기본 작업자는 뺏슨생. 예전 기본값(작업자 1, 작업자 2)을 그대로 쓰던 브라우저는 옮겨 줌
    let ws = LS.get('workers', null);
    const OLD = ['작업자 1', '작업자 2'];
    if (!Array.isArray(ws) || !ws.length || (ws.length === 2 && ws[0] === OLD[0] && ws[1] === OLD[1])) { ws = [DEFAULT_WORKER]; LS.set('workers', ws); }
    S.workers = ws;
    let w = LS.get('worker', null);
    if (!w || !ws.includes(w)) { w = ws[0]; LS.set('worker', w); }
    S.worker = w;
    const fix = list => { let n = 0; list.forEach(x => { if (x && OLD.includes(x.owner) && !ws.includes(x.owner)) { x.owner = ws[0]; n++; } }); return n; };
    if (fix(S.projects)) LS.set('projects', S.projects);
    if (fix(S.motifs)) LS.set('motifs', S.motifs);
    const draft = LS.get('draft', null);
    if (draft && draft.P) { S.P = migrate(draft.P); S.id = draft.id; S.dirty = !!draft.dirty; }
    renderAll();
    try {
      if (window.claude && window.claude.use) {
        // 공유 저장소는 앱 주인과 편집 권한이 있는 사람만 씀. 링크로 받은 사람은 자기 브라우저에 저장.
        const user = await window.claude.use('user');
        const editor = user ? await user.canEdit() : false;
        if (editor) {
          const db = await window.claude.use('db');
          if (db) { this.db = db; S.store = 'db'; this.subscribe(); renderHeader(); if (S.tab === 'proj') renderTab(); }
        }
      }
    } catch (e) { }
    try { if (window.claude && window.claude.use) { S.dl = await window.claude.use('downloads'); if (S.tab === 'print') renderTab(); } } catch (e) { S.dl = null; }
  },
  subscribe() {
    const db = this.db;
    const timer = setTimeout(() => toast('공유 저장소 응답이 늦습니다. 이 기기 저장본으로 계속합니다.'), 10000);
    this.unsubs.push(db.collection('projects').onSnapshot(snap => {
      clearTimeout(timer);
      S.projects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      LS.set('projects', S.projects);
      if (S.tab === 'proj') renderTab();
    }, () => { clearTimeout(timer); }));
    this.unsubs.push(db.collection('motifs').onSnapshot(snap => {
      S.motifs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      LS.set('motifs', S.motifs);
      recompute();
    }, () => { }));
    this.unsubs.push(db.doc('settings/workers').onSnapshot(d => {
      if (d.exists && Array.isArray(d.data().names) && d.data().names.length) { S.workers = d.data().names; LS.set('workers', S.workers); if (!S.workers.includes(S.worker)) S.worker = S.workers[0]; renderHeader(); if (S.tab === 'proj') renderTab(); }
    }, () => { }));
  },
  async saveProject(id, rec) {
    const i = S.projects.findIndex(p => p.id === id);
    if (i >= 0) S.projects[i] = { id, ...rec }; else S.projects.push({ id, ...rec });
    LS.set('projects', S.projects);
    if (this.db) await this.db.collection('projects').doc(id).set(rec);
  },
  async deleteProject(id) {
    S.projects = S.projects.filter(p => p.id !== id); LS.set('projects', S.projects);
    if (this.db) await this.db.collection('projects').doc(id).delete();
  },
  async saveMotif(m) {
    const { id, custom, ...rec } = m;
    const i = S.motifs.findIndex(x => x.id === id);
    if (i >= 0) S.motifs[i] = { id, ...rec }; else S.motifs.push({ id, ...rec });
    LS.set('motifs', S.motifs);
    if (this.db) await this.db.collection('motifs').doc(id).set(rec);
  },
  async deleteMotif(id) {
    S.motifs = S.motifs.filter(m => m.id !== id); LS.set('motifs', S.motifs);
    if (this.db) await this.db.collection('motifs').doc(id).delete();
  },
  async saveWorkers() { LS.set('workers', S.workers); if (this.db) await this.db.doc('settings/workers').set({ names: S.workers }); },
};
function migrate(p) {
  const d = defaultProject();
  const out = { ...d, ...p };
  ['body', 'ease', 'design', 'gauge', 'pattern', 'progress'].forEach(k => out[k] = { ...d[k], ...(p[k] || {}) });
  if (!Array.isArray(out.textDone)) out.textDone = [];
  if (!Array.isArray(out.grading)) out.grading = [];
  return out;
}
function saveDraft() { LS.set('draft', { P: S.P, id: S.id, dirty: S.dirty }); }
async function saveCurrent() {
  if (!S.id) S.id = uid();
  const rec = { name: S.P.name || '이름 없는 도안', owner: S.worker, updated: Date.now(), data: JSON.parse(JSON.stringify(S.P)) };
  try { await Store.saveProject(S.id, rec); S.dirty = false; saveDraft(); updateSaveState(); toast(Store.db ? '공유 저장소에 저장했습니다.' : '이 브라우저에 저장했습니다.'); }
  catch (e) { toast('저장하지 못했습니다: ' + (e && e.code ? e.code : '오류')); }
}

/* ===================== 계산 ===================== */
let rcT = null;
function touch() { S.dirty = true; saveDraft(); updateSaveState(); clearTimeout(rcT); rcT = setTimeout(recompute, 220); }
function touchQuiet() { S.dirty = true; saveDraft(); updateSaveState(); } // 진행 단수, 체크처럼 재계산이 필요 없는 변경
function recompute() {
  try {
    const P = S.P;
    const bad = [];
    ['chest', 'hip', 'shoulder', 'armDepth', 'neckW', 'armLen', 'upperArm', 'wrist'].forEach(k => { if (!(P.body[k] > 0)) bad.push(k); });
    if (!(P.gauge.st > 0) || !(P.gauge.row > 0)) bad.push('게이지');
    if (!(P.design.length > 0)) bad.push('총장');
    if (bad.length) { S.err = '입력값을 확인하세요. 0보다 큰 숫자가 필요합니다.'; S.C = null; }
    else { S.C = compute(P, allMotifs()); S.T = buildText(P, S.C); S.err = null; }
  } catch (e) { S.err = '계산 중 오류가 발생했습니다: ' + e.message; S.C = null; console.error(e); }
  if (S.C && !S.C.pieces.find(p => p.id === S.piece)) S.piece = S.C.pieces[0].id;
  renderTab(true);
}

const TAB_GROUPS = [['설계', [['proj', '프로젝트'], ['size', '치수'], ['design', '디자인'], ['motif', '무늬']]], ['산출물', [['chart', '차트'], ['schem', '도식화'], ['text', '서술형'], ['print', '출력']]]];
function renderAll() {
  $('#app').innerHTML = `
  <header class="top">
    <div class="brand"><span class="bmark" aria-hidden="true">${moonSVG(40, { disc: BRAND.moon, zoom: 1.32 })}</span><span class="bname"><span class="logo">코와단</span><span class="sub"><span class="h1">달의</span> <span class="h2">정원</span> <span class="h3">손뜨개</span></span></span></div>
    <div class="hdr" id="hdr"></div>
  </header>
  <nav class="tabs" id="tabs">${TAB_GROUPS.map(([g, tabs], gi) => `${gi ? '<span class="tdiv" aria-hidden="true"></span>' : ''}<span class="tgl">${g}</span>${tabs.map(([k, n]) => `<button data-tab="${k}">${icon(k)}<span>${n}</span></button>`).join('')}`).join('')}</nav>

  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) { S.tab = b.dataset.tab; LS.set('tab', S.tab); renderTab(); window.scrollTo(0, 0); } });
  S.tab = LS.get('tab', 'size');

function renderHeader() {
  const h = $('#hdr'); if (!h) return;
  if (h.dataset.built && document.activeElement && document.activeElement.id === 'pname') { updateSaveState(); return; }
  h.dataset.built = '1';
  h.innerHTML = `
    <input class="pname" id="pname" value="${esc(S.P.name)}" aria-label="도안 이름">
    <select id="worker" aria-label="작업자">${S.workers.map(w => `<option ${w === S.worker ? 'selected' : ''}>${esc(w)}</option>`).join('')}</select>
    <button class="btn pri" id="saveBtn">저장</button>`;
  $('#pname').oninput = e => { S.P.name = e.target.value; touchQuiet(); };
  $('#worker').onchange = e => { S.worker = e.target.value; LS.set('worker', S.worker); if (S.tab === 'proj') renderTab(); };
  $('#saveBtn').onclick = saveCurrent;
  updateSaveState();
}
function updateSaveState() {
  const b = $('#saveBtn'); if (!b) return;
  b.textContent = S.dirty ? '저장' : '저장됨';
  b.classList.toggle('dirty', S.dirty);
  const n = $('#pname'); if (n && document.activeElement !== n && n.value !== S.P.name) n.value = S.P.name;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === S.tab));
}
function renderTab(fromCompute) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const m = $('#main'); if (!m) return;
  // 입력 화면은 계산 때마다 다시 그리지 않음 (포커스 유지)
  const same = S.renderedTab === S.tab && m.firstElementChild;
  if (fromCompute && same && (S.tab === 'size' || S.tab === 'design')) { updateLive(); return; }
  if (fromCompute && same && S.tab === 'motif' && S.editor) return;
  if (fromCompute && same && S.tab === 'chart' && $('#chartbox') && S.C) { refreshChart(); return; }
  S.renderedTab = S.tab;
  const f = { proj: viewProj, size: viewSize, design: viewDesign, motif: viewMotif, chart: viewChart, schem: viewSchem, text: viewText, print: viewPrint }[S.tab];
  m.innerHTML = f();
  bindInputs(m);
  ({ proj: bindProj, size: bindSize, design: () => { }, motif: bindMotif, chart: bindChart, schem: bindSchem, text: bindText, print: bindPrint })[S.tab]();
  updateLive();
}
function warnBox() {
  if (S.err) return `<div class="alert">${esc(S.err)}</div>`;
  if (!S.C || !S.C.warnings.length) return '';
  return `<div class="alert"><b>확인이 필요합니다</b><ul>${S.C.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`;
}
function num(path, label, unit, opt = {}) {
  const v = getPath(S.P, path);
  return `<label class="fld${opt.wide ? ' wide' : ''}"><span class="lb">${label}</span>
    <span class="iw"><input type="number" inputmode="decimal" step="${opt.step || 0.5}" data-path="${path}" data-num="1" value="${v ?? ''}">${unit ? `<em>${unit}</em>` : ''}</span>${opt.help ? `<i class="hp">${opt.help}</i>` : ''}</label>`;
}
function txt(path, label, opt = {}) {
  return `<label class="fld${opt.wide ? ' wide' : ''}"><span class="lb">${label}</span><span class="iw"><input type="text" data-path="${path}" value="${esc(getPath(S.P, path))}" placeholder="${opt.ph || ''}"></span></label>`;
}
function seg(path, label, opts) {
  const v = getPath(S.P, path);
  return `<div class="fld wide"><span class="lb">${label}</span><div class="seg" data-seg="${path}">${opts.map(([k, n]) => `<button type="button" data-v="${k}" class="${String(v) === String(k) ? 'on' : ''}">${n}</button>`).join('')}</div></div>`;
}
function sel(path, label, opts) {
  const v = getPath(S.P, path);
  return `<label class="fld"><span class="lb">${label}</span><span class="iw"><select data-path="${path}">${opts.map(([k, n]) => `<option value="${esc(k)}" ${String(v) === String(k) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></span></label>`;
}
function chk(path, label) {
  return `<label class="chk"><input type="checkbox" data-path="${path}" ${getPath(S.P, path) ? 'checked' : ''}><span>${label}</span></label>`;
}
function bindInputs(root) {
  root.querySelectorAll('input[data-path], select[data-path]').forEach(el => {
    const ev = el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.dataset.num) v = v === '' ? 0 : parseFloat(v);
      if (el.tagName === 'SELECT' && v === '') v = null;
      setPath(S.P, el.dataset.path, v);
      if (el.dataset.path.startsWith('ease.')) { S.P.fit = 'custom'; document.querySelectorAll('[data-fit]').forEach(x => x.classList.toggle('on', x.dataset.fit === 'custom')); }
      touch();
    });
  });
  root.querySelectorAll('[data-seg]').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const path = g.dataset.seg, cur = getPath(S.P, path);
    let v = b.dataset.v; if (v === 'true') v = true; if (v === 'false') v = false;
    if (path === 'gauge.unit' && v !== cur) { const f = v === 'cm' ? 0.1 : 10; S.P.gauge.st = +(S.P.gauge.st * f).toFixed(2); S.P.gauge.row = +(S.P.gauge.row * f).toFixed(2); }
    setPath(S.P, path, v);
    g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    touch();
    if (path === 'garment' || path === 'neck' || path === 'gauge.unit' || path === 'sleeve') renderTab();
  }));
}
function updateLive() {
  document.querySelectorAll('[data-live]').forEach(el => {
    const k = el.dataset.live;
    if (k.startsWith('t.')) { const f = k.slice(2); const v = (S.P.body[f] || 0) + (S.P.ease[f] || 0); el.textContent = fmt(v); }
    if (k === 'warn') el.innerHTML = warnBox();
    if (k === 'insp') el.innerHTML = inspectorHTML();
    if (k === 'alloc') el.innerHTML = allocHTML();
  });
}
function yarnInfo(C) {
  if (!C || !C.yarnG) return null;
  const g = S.P.gauge, grams = Math.ceil(C.yarnG / 10) * 10;
  const balls = g.ballW ? Math.ceil(C.yarnG / g.ballW) : null;
  const meters = g.ballW && g.ballLen ? Math.ceil(C.yarnG / g.ballW * g.ballLen / 10) * 10 : null;
  return { grams, balls, meters };
}
function maxSts(pc) { let m = 0; for (let r = 1; r <= pc.total; r++) { const w = (pc.rows[r] || []).reduce((a, s) => a + s.r - s.l + 1, 0); if (w > m) m = w; } return m; }

const ALLOC_COL = { sel: '#78716C', bg: '#ECE6DE', purl: '#B8ADA2', center: '#F5E6C8', side: '#E8C9BB', gap: '#F3EFEA' };
function allocHTML() {
  const C = S.C; if (!C) return '';
  const pc = C.pieces.find(p => p.kind === 'front' || p.kind === 'rfront');
  const lay = pc.lay, Nc = pc.info.Nc;
  const bgSide = (Nc - lay.panelW - 2) / 2;
  const segs = [{ t: 'sel', n: 1, name: '가장자리' }, { t: 'bg', n: bgSide, name: '바탕' }];
  lay.blocks.forEach(b => {
    if (b.type === 'purl') segs.push({ t: 'purl', n: b.w, name: '안뜨기' });
    else if (b.type === 'bg') segs.push({ t: 'gap', n: b.w, name: '사이바탕' });

function bindEditor() {

    cells.forEach(row => row.forEach((v, c) => { if (typeof v === 'object') { const x = parseTok(v.tok); if (c - v.j + x.w > w) row[c] = 'k'; } }));

  $('#eclearp').onclick = () => { pushHist(E); E.cells = E.cells.map(r => r.map(() => 'p')); editorRefresh(); };

  $('#edup').onclick = () => {
    if (E.h < 2 || E.h + 2 > 80) return toast('높이가 2단 이상, 78단 이하일 때만 복제할 수 있습니다.');
    pushHist(E);
    const top = E.cells.slice(E.h - 2).map(r => r.map(v => typeof v === 'object' ? { ...v } : v));
    E.cells = E.cells.concat(top); E.h += 2; editorRefresh();
  };

  };
  $('#efill').onclick = () => {
    pushHist(E);
    for (let r = 1; r < E.h; r += 2) {
      const below = E.cells[r - 1];
      E.cells[r] = below.map(v => {
        if (typeof v === 'object') return crossOut(v.tok, v.j);
        if (v === 'p') return 'p';
        if (v === 'tk') return 'tk';
        return 'k';
      });
    }
    editorRefresh();
  };
  $('#esave').onclick = async () => {
    const rows = editorTokens(E);
    const errs = motifCheck({ rows });
    if (errs.length) return toast('무늬에 확인할 점이 있어 저장하지 않았습니다.');
    const m = { id: E.id || 'u' + uid(), name: E.name || '내 무늬', cat: '내 무늬', rows, owner: S.worker, updated: Date.now() };
    try { await Store.saveMotif(m); toast('무늬를 저장했습니다.'); } catch (e) { toast('저장하지 못했습니다.'); }
    S.editor = null; recompute(); renderTab();
  };
  const cv = $('#ecanvas');
  const cellAt = e => {
    const svg = cv.querySelector('svg'); if (!svg) return null;
    const rect = svg.getBoundingClientRect();
    const G = chartGeom({ W: E.w, total: E.h }, { cw: E.cs, ch: E.cs });
    const sx = svg.viewBox.baseVal.width / rect.width;
    const x = (e.clientX - rect.left) * sx, y = (e.clientY - rect.top) * sx;
    const c = Math.floor((x - G.mL) / E.cs), r = E.h - 1 - Math.floor((y - G.mT) / E.cs);
    if (c < 0 || c >= E.w || r < 0 || r >= E.h) return null;
    return { r, c };
  };
  let drag = null;
  cv.onpointerdown = e => {
    if (e.button !== undefined && e.button !== 0) return;
    const p = cellAt(e); if (!p) return;
    e.preventDefault();
    pushHist(E);
    placeTool(E, p.r, p.c, E.tool);
    editorRefresh();
    if (!parseTok(E.tool)) { drag = { key: p.r + ':' + p.c }; try { cv.setPointerCapture(e.pointerId); } catch (_) { } }
  };
  cv.onpointermove = e => {
    if (!drag) return;
    const p = cellAt(e); if (!p) return;
    const key = p.r + ':' + p.c; if (key === drag.key) return;
    drag.key = key; placeTool(E, p.r, p.c, E.tool); editorRefresh();
  };
  cv.onpointerup = cv.onpointercancel = () => { drag = null; };
  requestAnimationFrame(editorRefresh);
}
function placeTool(E, r, c, tool) {
  const row = E.cells[r];
  const clearAt = cc => { const v = row[cc]; if (typeof v === 'object') { const x = parseTok(v.tok); const st = cc - v.j; for (let j = 0; j < x.w; j++) row[st + j] = 'k'; } };
  const x = parseTok(tool);
  if (!x) { clearAt(c); row[c] = tool; return; }
  if (r % 2 === 1) { toast('교차뜨기는 홀수 단(겉면)에 두세요.'); return; }
  if (c + x.w > E.w) { toast(`이 교차는 ${x.w}칸이 필요합니다.`); return; }
  for (let j = 0; j < x.w; j++) clearAt(c + j);
  for (let j = 0; j < x.w; j++) row[c + j] = { tok: tool, j };
}

function scheduleRows(pc, C) {
  const out = [];
  const info = pc.info, nk = info.neck;
  const live = r => (pc.rows[r] || []).reduce((a, s) => a + s.r - s.l + 1, 0);
  const zone = (r, side, seg) => {
    if (pc.kind === 'sleeve') return r >= info.capStart ? '소매산' : '소매 옆선';
    if (nk && r > nk.s && ((seg === 'L' && side === 'right') || (seg === 'R' && side === 'left'))) return pc.kind === 'back' ? '뒷목' : '앞목';
    if (nk && r >= nk.s && ((pc.kind === 'rfront' && side === 'right') || (pc.kind === 'lfront' && side === 'left'))) return '앞목';
    if (r >= C.shStart) return '어깨';
    if (r >= C.ahStart) return '진동';
    return '옆선';
  };
  for (let r = 1; r <= pc.total; r++) {
    const row = pc.codes[r] || [], segs = pc.rows[r] || [];
    const acts = [];
    if (r === pc.total && pc.finalBo) { out.push({ r, text: `남은 ${live(r)}코 모두 덮어씌우기`, after: 0 }); continue; }
    segs.forEach(s => {
      let c = s.l;
      while (c <= s.r) {
        const v = row[c];
        if (v === 'bo' || v === 'sr') {
          let e = c; while (e + 1 <= s.r && row[e + 1] === v) e++;
          const n = e - c + 1;
          const side = c === s.l ? 'left' : e === s.r ? 'right' : 'center';
          const zn = side === 'center' ? (pc.kind === 'back' ? '뒷목 중앙' : '앞목 중앙') : zone(r, side, s.name);
          acts.push({ zone: zn, side: /목$/.test(zn) && (s.name === 'L' || s.name === 'R') ? 'seg' + s.name : side, kind: v === 'sr' ? '되돌아뜨기 남김' : '덮어씌우기', n });
          c = e + 1; continue;
        }
        if (v === 'k2tog' || v === 'ssk' || v === 'm1l' || v === 'm1r') {
          const sd = c - s.l < s.r - c ? 'left' : 'right', zn = zone(r, sd, s.name);
          acts.push({ zone: zn, side: /목$/.test(zn) && (s.name === 'L' || s.name === 'R') ? 'seg' + s.name : sd, kind: v === 'm1l' || v === 'm1r' ? '늘림' : '줄임', n: 1 });
        }
        c++;
      }
    });
    const nextSegs = (pc.rows[r + 1] || []).length;
    const splitNow = segs.length === 1 && nextSegs === 2;
    if (!acts.length && !splitNow) continue;
    // 같은 구역, 같은 동작, 같은 코 수의 좌우를 '양쪽'으로 합침
    const merged = [];
    acts.forEach(a => {
      const twin = merged.find(m => m.zone === a.zone && m.kind === a.kind && m.n === a.n && m.side !== a.side && m.side !== 'both' && a.side !== 'center');
      if (twin) twin.side = 'both'; else merged.push({ ...a });
    });
    const sideTxt = s => s === 'both' ? '양쪽 ' : s === 'left' ? '왼쪽 ' : s === 'right' ? '오른쪽 ' : s === 'segL' ? '(차트 왼쪽 조각) ' : s === 'segR' ? '(차트 오른쪽 조각) ' : '';
    const parts = merged.map(a => `${a.zone} ${sideTxt(a.side)}${a.n}코${a.side === 'both' && a.kind !== '덮어씌우기' ? '씩' : ''} ${a.kind}`);
    if (splitNow) parts.push('좌우로 나누어 뜨기 시작');
    out.push({ r, text: parts.join(', '), after: r < pc.total ? live(r + 1) : 0 });
  }
  return out;
}
function scheduleHTML(pc, C) {
  const rows = scheduleRows(pc, C);
  return `<details class="sched"><summary>📋 ${esc(pc.name)}: 단수별 줄임, 늘림, 목, 어깨 정확한 단 번호 일람표 (${rows.length}개 단)</summary>

            const cx = X0 + (i % 2) * colW, cy = y0 + 36 + Math.floor(i / 2) * 30;
            const w = parseTok(s) ? parseTok(s).w : 1;
            D.rect(cx, cy, w * cs, cs, PAPER, GRID, 0.8);
            if (parseTok(s)) drawCross(D, s, cx, cy, cs, cs, PAPER); else drawSym(D, s, cx, cy, cs, cs, { showKnit: true });
            D.text(cx + w * cs + 10, cy + cs / 2, symName(s), 12, INK, 'left');
          });
        });
        y += h + 10; return;
      }
      const sty = { title: [30, 700, 14], sub: [14, 400, 6], h1: [24, 700, 14], h2: [18, 700, 10], h3: [14, 700, 6], p: [13, 400, 6], li: [13, 400, 4], note: [12, 400, 4] }[b.t];
      const [size, wt, gap] = sty;
      const indent = b.t === 'li' ? 18 : 0;
      const lines = wrapLines(tmp, px, b.s, size, wt, X1 - X0 - indent);
      const lh = size * 1.55;
      if (b.t === 'h2' || b.t === 'h3') { if (y + lh * 3 > Y1) flush(); y += gap; }
      if (b.t === 'h2') { const yy = y; page.push(D => D.line(X0, yy - 4, X1, yy - 4, 1, RIBLINE)); y += 6; }
      lines.forEach((ln, i) => {
        if (y + lh > Y1) flush();
        const yy = y;
        page.push(D => { if (b.t === 'li' && i === 0) D.circle(X0 + 6, yy + lh / 2, 2.4, INK); D.text(X0 + indent, yy + lh / 2, ln, size, INK, 'left', wt); });
        y += lh;
      });
      y += b.t === 'h2' ? 4 : gap;
    });
    if (page.length) flush();
  }
  if (o.schem) {
    const list = schemPieces(C);
    pages.push(D => {
      D.text(X0, Y0 + 10, '도식화', 22, INK, 'left', 700);
      const fs = 12, cols = 2;
      const cellW = (X1 - X0) / cols, cellH = (Y1 - Y0 - 40) / Math.ceil(list.length / cols);
      const maxWcm = Math.max(...list.map(pc => pc.W / C.gs)), maxHcm = Math.max(...list.map(pc => pc.total / C.gr));
      const scale = Math.min((cellW - fs * 14) / maxWcm, (cellH - fs * 9) / maxHcm);
      list.forEach((pc, i) => {
        const cx = X0 + (i % cols) * cellW, cy = Y0 + 40 + Math.floor(i / cols) * cellH;
        drawSchematicPiece(D, C, pc, cx + fs * 8, cy + fs * 6, scale, fs);
      });
    });
  }
  if (o.grade && gradeSizes().length >= 2) {
    const res = gradingResults(), rows = gradingRows(res);
    const colW0 = 150, colW = (X1 - X0 - colW0) / res.length, lh = 24;
    const tmp = document.createElement('canvas').getContext('2d'), px = 1240 / PG.W;
    let items = [], y = Y0 + 46;
    const pagesG = [];
    const header = yy => D => {
      D.fillRect(X0, yy, X1 - X0, lh, '#1C1917');
      res.forEach((x, i) => D.text(X0 + colW0 + colW * i + colW / 2, yy + lh / 2, presetLabel(x.k) + (x.k.startsWith('m') ? ' (남)' : x.k.startsWith('k') ? ' (아동)' : ''), 12, '#FFFFFF', 'center', 700));
    };
    items.push(header(y)); y += lh;
    rows.forEach(r => {
      const lines = r.head ? [[r.head]] : r.vals.map(v => wrapLines(tmp, px, v, 11, 400, colW - 10));
      const h = r.head ? lh : Math.max(...lines.map(l => l.length)) * 16 + 8;
      if (y + h > Y1) { pagesG.push(items); items = []; y = Y0 + 46; items.push(header(y)); y += lh; }
      const yy = y;
      if (r.head) items.push(D => { D.fillRect(X0, yy, X1 - X0, lh, '#F3EFEA'); D.text(X0 + 8, yy + lh / 2, r.head, 12, INK, 'left', 700); });
      else items.push(D => {
        D.line(X0, yy + h, X1, yy + h, 0.6, GRID);
        D.text(X0 + 8, yy + 12, r.label, 11, INK, 'left', 700);
        lines.forEach((ls, i) => ls.forEach((ln, j) => D.text(X0 + colW0 + colW * i + 5, yy + 12 + j * 16, ln, 11, INK, 'left')));
      });
      y += h;
    });
    pagesG.push(items);
    pagesG.forEach((it, i) => pages.push(D => { D.text(X0, Y0 + 14, i ? '사이즈 그레이딩 표 (이어서)' : '사이즈 그레이딩 표', 22, INK, 'left', 700); it.forEach(fn => fn(D)); }));
  }
  if (o.motifs) {
    const used = [];
    C.pieces.forEach(pc => pc.placements.slice().reverse().forEach(p => { if (p.kind === 'motif' && !used.find(m => m.id === p.motif.id)) used.push(p.motif); }));
    if (used.length) {
      let items = [], x = X0, y = Y0 + 40, rowH = 0;
      const pagesM = [];
      const pushPage = () => { const it = items; pagesM.push(it); items = []; x = X0; y = Y0 + 40; rowH = 0; };
      used.forEach(m => {
        const mp = motifPiece(m);
        const cs = 20;
        const G = chartGeom(mp, { cw: cs, ch: cs, title: `${m._label || ''} ${m.name}` });
        const w = Math.max(G.width, 200), h = G.height;
        if (x + w > X1) { x = X0; y += rowH + 20; rowH = 0; }
        if (y + h > Y1) pushPage();
        const ox = x, oy = y;
        items.push((D) => { const sub = new D.constructor(D.c, D.ox + ox * D.s, D.oy + oy * D.s, D.s); drawChart(sub, mp, { cw: cs, ch: cs, showKnit: true, title: `${m._label || ''} ${m.name}` }); });
        x += w + 24; rowH = Math.max(rowH, h);
      });
      if (items.length) pushPage();
      pagesM.forEach((it, i) => pages.push(D => { D.text(X0, Y0 + 10, i ? '무늬 차트 (이어서)' : '무늬 차트', 22, INK, 'left', 700); it.forEach(fn => fn(D)); }));
    }
  }
  if (o.charts) {
    const cw = o.cell * 4, ratio = o.ratio;
    C.pieces.forEach(pc => {
      const ch = ratio ? cw * C.gs / C.gr : cw;
      const G0 = chartGeom(pc, { cw, ch, title: 'x' });
      const availW = X1 - X0 - G0.mL - G0.mR, availH = Y1 - Y0 - G0.mT - G0.mB - 10;
      const nc0 = Math.max(1, Math.floor(availW / cw)), nr0 = Math.max(1, Math.floor(availH / ch));
      const nc = Math.ceil(pc.W / Math.ceil(pc.W / nc0)), nr = Math.ceil(pc.total / Math.ceil(pc.total / nr0));
      const tiles = [];
      for (let r0 = 1; r0 <= pc.total; r0 += nr) {
        for (let c1 = pc.W - 1; c1 >= 0; c1 -= nc) {
          const c0 = Math.max(0, c1 - nc + 1), r1 = Math.min(pc.total, r0 + nr - 1);
          let any = false;
          for (let r = r0; r <= r1 && !any; r++) for (let c = c0; c <= c1; c++) if (pc.codes[r] && pc.codes[r][c] != null) { any = true; break; }
          if (any) tiles.push({ r0, r1, c0, c1 });
        }
      }
      tiles.forEach((t, i) => {
        const title = `${pc.name} 차트 ${i + 1}/${tiles.length}: ${pc.W - t.c1}~${pc.W - t.c0}코, ${t.r0}~${t.r1}단`;
        pages.push(D => { const sub = new D.constructor(D.c, D.ox + X0 * D.s, D.oy + Y0 * D.s, D.s); drawChart(sub, pc, { cw, ch, r0: t.r0, r1: t.r1, c0: t.c0, c1: t.c1, showKnit: S.chart.showKnit, tint: S.chart.tint, center: S.chart.center, title }); });
      });
    });
  }
  return pages;
}

/* ===================== 시작 ===================== */
S.chart = { ...S.chart, ...LS.get('chart', {}) };
S.print = { ...S.print, ...LS.get('print', {}) };
S.brand = { ko: '달의정원 손뜨개', en: "Luna's Garden", on: true, ...LS.get('brand', {}) };
window.addEventListener('DOMContentLoaded', () => Store.init());

</script>
